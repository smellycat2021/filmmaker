[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Engine/Maps/Templates/OpenWorld
GameDefaultMap=/Engine/Maps/Templates/OpenWorld

[/Script/Engine.RendererSettings]
; Lumen GI + reflections, no hardware ray tracing (Apple Silicon)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
r.AntiAliasingMethod=4
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
; MRQ needs alpha + velocity for passes
r.PostProcessing.PropagateAlpha=1
r.VelocityOutputPass=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True

[/Script/Engine.Engine]
; keep the editor at cinema frame rate
bSmoothFrameRate=False
bUseFixedFrameRate=True
FixedFrameRate=24.000000

