# Gate 0 character definition — the authoritative input.
# MetaHuman Creator settings are DERIVED from this file, not the other way round.
# This file is the seed of the production IR's character schema (design doc §5.3, §6.2).
#
# Conventions: engine-native (Unreal). Z-up, left-handed, centimeters.
# Body proportions are REAL MEASUREMENTS in cm, matching the fields of the UE 5.8 MetaHuman
# Character editor's Body > Model > Parametric tool, so they can be typed in directly.
# Method: the base preset's (Celeste's) defaults ARE the young stage, unchanged. Middle and
# old are deltas from young. Fields not listed stay at the preset default at every stage.
# AcrossShoulder in MetaHuman is NOT full back width (default is much smaller than ~38 cm) — it is
# left at the preset default for young and scaled by percentage for the other stages.

character: alice
canonical_rig: metahuman_adult_v1          # shared skeleton; hierarchy + bind pose fixed
version: 1

# What makes it the same person. Fixed across all stages.
# These are written as MetaHuman Creator terms so they can be set once and locked.
shared:
  sex: female
  base_preset: Celeste                  # MetaHuman 5.8 Core Data preset, applied 2026-09-21
  blend: none                            # single preset, no blending
  # Built in the UE 5.8 MetaHuman Character editor from the Celeste preset (2026-09-21).
  # All edits below are ONE-SIDED (Symmetric Manipulation off) — the asymmetry IS the identity.
  distinguishing_features:
    - "model's LEFT eye sits lower than the right"
    - "model's LEFT eyebrow is lifted relative to the right"
    - "model's LEFT side of the face is dragged down (cheek/jaw lower than the right)"
  # Everything else (bone structure, eye spacing, nose, mouth) is Celeste's default.
  # These three must be visible at every age stage and are the checklist for the
  # beautifier test: if the generative output re-symmetrizes her, that is a FAIL.
  eye_color: preset_default

stages:
  young:
    age: 22
    proportions_cm:                        # MetaHuman Body > Model > Parametric field names
      Height: preset_default               # record Celeste's value here once read: ___
      AcrossShoulder: preset_default       # ___
      Hip: preset_default                  # ___
      Waist: preset_default                # ___
      Chest: preset_default                # ___
      HandCircumference: preset_default    # ___
      NeckLength: preset_default           # ___
      Neck: preset_default                 # ___
    face:                                  # young = Celeste default skin, no edits
      skin_face_texture: preset_default    # Materials > Skin > Face (HF detail map)
      skin_roughness: preset_default       # Materials > Skin > Roughness (0.85–1.15)
      sculpt_aging: none
      hair: preset_default
    constraints: {}

  middle:
    age: 45
    proportions_cm:                        # deltas from young
      Height: young
      AcrossShoulder: "young * 1.015"
      Hip: "young + 4"
      Waist: "young + 6"
      Chest: "young + 4"
      HandCircumference: young
      NeckLength: young
      Neck: "young + 1"
    face:
      skin_face_texture: "more pore/wrinkle detail than young"   # pick a mid-detail HF map
      skin_roughness: "young + 0.03"
      sculpt_aging: "light nasolabial folds, slight crow's feet; keep the 3 asymmetries"
      hair: "grey at temples"
    constraints: {}

  old:
    age: 72
    proportions_cm:                        # deltas from young
      Height: "young - 5"                  # height loss with age
      AcrossShoulder: "young * 0.96"
      Hip: "young + 4"
      Waist: "young + 10"
      Chest: "young + 4"
      HandCircumference: "young - 0.5"
      NeckLength: "young - 0.5"
      Neck: "young + 1"
      # arm lengths stay at default; reach geometry changes via the stoop constraint below
    face:
      skin_face_texture: "highest wrinkle/pore detail available"
      skin_roughness: "young + 0.08"
      sculpt_aging: "cheeks pulled down, jowls, deep nasolabial folds, thinner lips; keep the 3 asymmetries"
      hair: "grey-white, thinner"
    constraints:
      spine_stoop_deg: 8                   # forward flexion applied on top of every clip
      # This is the only "character-specific constraint" in Gate 0.
      # It must NOT break contact at the fridge handle or the can — that's a scored check.

# Every stage plays the SAME clips. Motion is deliberately not aged (design doc §13.1).
motion:
  clips: [walk, turn, open_fridge, reach_grasp, retract, close_fridge]
  source: "TODO — library name + clip IDs once chosen (Fab / Mixamo / other)"
  retarget: once, onto canonical_rig
  contact_ik:
    events: [reach_target, grip_established, release]
    targets: [fridge_01.handle, soda_can_01.grasp_point]
  face:
    source: "live_link_face | hand_keyed"
    minimum: [blink_x3, eye_dart_x2, small_expression_at_grasp]

# Identity conditioning input for the generative step — taken FROM the conventional render.
identity_refs:
  per_stage: 8
  frames: "3 face-closest during orbit, 2 profile, 3 full-body"
